# Hochschule Campus Wien — brand spec for theme-authoring.
#
# Generates per-format themes for the HCW visual identity:
#   monochromatic petrol-blue + slate-grey, logo top-right, no yellow.
#
# Use this as a reference for authoring your own brand.yaml. See
# ../references/brand-spec.md for the full schema.

version: 1

brand:
  name: "Hochschule Campus Wien"
  short: "hcw"

palette:
  # Body-text contrast pairs — gated by WCAG AA (4.5:1) hard-error
  text: "#1A1A1A"
  bg:   "#FFFFFF"

  # Brand colors (extracted live from hcw.ac.at + the HCW logo SVG)
  primary:      "#36566D"   # petrol-blue — h1, brand surfaces, links
  secondary:    "#4B5059"   # slate-grey — h2, body emphasis (also the logo's only fill)
  primary_soft: "#7897AC"   # softer tint — h3, subtitles
  accent:       null        # HCW intentionally has no accent (no yellow)

  # Surface tokens
  bg_alt:    "#F1F4F7"      # code blocks, blockquote backgrounds
  rule:      "#4B5059"      # divider lines, h1 underline
  rule_soft: "#DDE3E8"      # table cell rules, footer separator

  # Inverted variant — used by section divider slides
  inverse:
    text: "#FFFFFF"
    bg:   "primary"          # token reference: resolves to palette.primary

typography:
  body:     ["Helvetica Neue", "Helvetica", "Arial", "sans-serif"]
  headings: ["Helvetica Neue", "Helvetica", "Arial", "sans-serif"]
  mono:     ["SF Mono", "Menlo", "Consolas", "monospace"]
  base_size_pt: 24            # calibrated against slide-overflow-check on 1280×720 canvas

  code:
    bg:           "bg_alt"
    border_color: "primary"
    border_width_px: 3
    font_size_ratio: 0.72

  table:
    header_color:           "primary"
    header_border_width_px: 2
    cell_border_color:      "rule_soft"

spacing:
  slide_padding:
    top:    110               # leaves room for top-anchored logo
    right:  70
    bottom: 60
    left:   70

logo:
  path: "./hcw-logo.svg"
  width_px: 160
  position: "top-right"
  offset:
    top:   35
    right: 50

footer:
  text:   "© {{year}} {{author}}"
  author: "Andreas Drozd"

variants:
  title:
    enabled: true
    align: "left"
    h1_size: "3.0em"
  section:
    enabled: true
    bg: "primary"
    fg: "white"
  two_column:
    enabled: true
    column_count: 2
    column_gap_rem: 2.5
