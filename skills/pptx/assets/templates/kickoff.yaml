meta:
  title: "<PROJECT NAME> — Project Kickoff"
  author: "<NAME>"
  aspect_ratio: "16:9"

slides:
  - layout: title
    title: "<PROJECT NAME>"
    subtitle: "Project Kickoff · YYYY-MM-DD"
    notes: "Sponsor: <SPONSOR-NAME>. Lead: <NAME>. ~20 min, 10-14 slides."

  - layout: bullets
    title: "Why now"
    bullets:
      - "<The trigger — a deadline, an incident, a regulation, an opportunity>"
      - "<Why this couldn't wait>"
      - "<What changes if we don't act>"

  - layout: bullets
    title: "The problem we're solving"
    bullets:
      - "<One-paragraph problem statement>"
      - "Who feels the pain: <segment>"
      - "How often: <frequency / scale>"
      - "Current workaround / cost: <one line>"

  - layout: bullets
    title: "Goals (measurable)"
    bullets:
      - "<GOAL 1> — measured as <metric>, target <number> by <date>"
      - "<GOAL 2> — measured as <metric>, target <number> by <date>"
      - "<GOAL 3> — measured as <metric>, target <number> by <date>"

  - layout: bullets
    title: "Non-goals"
    bullets:
      - "<NON-GOAL 1> — explicitly out of scope; <one-line why>"
      - "<NON-GOAL 2> — explicitly out of scope; <one-line why>"
      - "<NON-GOAL 3> — explicitly out of scope; <one-line why>"

  - layout: bullets
    title: "Scope matrix"
    bullets:
      - "<DOMAIN A>: in / out / deferred"
      - "<DOMAIN B>: in / out / deferred"
      - "<DOMAIN C>: in / out / deferred"

  - layout: bullets
    title: "Solution sketch"
    bullets:
      - "<Approach in one sentence>"
      - "<Key decision 1>"
      - "<Key decision 2>"

  - layout: bullets
    title: "Timeline & milestones"
    bullets:
      - "M1: Discovery complete — <YYYY-MM-DD> — <NAME>"
      - "M2: Design sign-off — <YYYY-MM-DD> — <NAME>"
      - "M3: MVP / Alpha — <YYYY-MM-DD> — <NAME>"
      - "M4: Beta / Pilot — <YYYY-MM-DD> — <NAME>"
      - "M5: GA / Launch — <YYYY-MM-DD> — <NAME>"

  - layout: bullets
    title: "Team & stakeholders"
    bullets:
      - "<NAME> — Lead — R, A"
      - "<NAME> — Eng — R"
      - "<NAME> — Design — C"
      - "<NAME> — Sponsor — A"

  - layout: bullets
    title: "Dependencies"
    bullets:
      - "<EXTERNAL DEPENDENCY 1> — owner, status, our risk if it slips"
      - "<EXTERNAL DEPENDENCY 2> — owner, status, our risk if it slips"
      - "<INTERNAL DEPENDENCY> — owner, status"

  - layout: bullets
    title: "Top risks & mitigations"
    bullets:
      - "<RISK 1> — H/M/L likelihood, H/M/L impact, <mitigation>"
      - "<RISK 2> — H/M/L likelihood, H/M/L impact, <mitigation>"
      - "<RISK 3> — H/M/L likelihood, H/M/L impact, <mitigation>"

  - layout: bullets
    title: "Success criteria & measurement"
    bullets:
      - "Definition of done: <one sentence>"
      - "How we measure: <metric, source, cadence>"
      - "Dashboard: <link or location>"

  - layout: bullets
    title: "Communication plan"
    bullets:
      - "Standup: <cadence> at <time>, <channel>"
      - "Demo / status: <cadence>, <audience>"
      - "Decision log: <where>"
      - "Escalation path: <who, when>"

  - layout: bullets
    title: "Decisions needed today"
    bullets:
      - "<DECISION 1>: <option A> vs <option B> — recommend <pick>"
      - "<DECISION 2>: <question>"
      - "<DECISION 3>: <question>"
    notes: "Kickoff ends when these decisions are made, not when the clock hits zero."

  - layout: end
    title: "Questions & decisions"
    subtitle: "<EMAIL>"
